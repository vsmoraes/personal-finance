name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.repository == 'vsmoraes/personal-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check merge credential
        id: credential
        env:
          AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          if [ -n "$AUTOMERGE_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPENDABOT_AUTOMERGE_TOKEN is not configured; leaving PR for manual merge."
          fi
      - name: Merge the tested Dependabot pull request
        if: steps.credential.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$PR_NUMBER"

          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json author,baseRefName,headRefOid,isDraft,state \
            --jq '[.author.login, .baseRefName, .headRefOid, .isDraft, .state] | @tsv')
          IFS=$'\t' read -r author base_ref head_sha is_draft state <<< "$pr"

          test "$author" = 'dependabot[bot]'
          test "$base_ref" = main
          test "$head_sha" = "$TESTED_SHA"
          test "$is_draft" = false
          test "$state" = OPEN

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --admin \
            --match-head-commit "$TESTED_SHA"
