name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - run: make verify
      - name: Install Playwright browser
        run: corepack pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - name: Audit dependencies
        run: corepack pnpm audit --audit-level=high
      - run: mkdir -p data && sudo chown -R 1000:1000 data
      - name: Verify Docker persistence
        run: corepack pnpm test:docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          if-no-files-found: ignore
          path: |
            coverage/
            test-results/
