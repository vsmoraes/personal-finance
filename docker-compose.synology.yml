services:
  finance:
    image: ${FINANCE_IMAGE:-ghcr.io/example/personal-finance}:${FINANCE_TAG:-latest}
    container_name: personal-finance
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${SYNOLOGY_DATA_DIR:-/volume1/docker/personal-finance/data}:/data
    environment:
      DATABASE_URL: file:/data/finance.db
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
